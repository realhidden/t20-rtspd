[user]

;	ENC_RC_MODE_FIXQP               = 0,	/**< Fixqp 模式 */
;	ENC_RC_MODE_CBR                 = 1,	/**< CBR 模式 */
;	ENC_RC_MODE_VBR                 = 2,	/**< VBR 模式*/
;	ENC_RC_MODE_SMART               = 3,	/**< Smart 模式*/
;	ENC_RC_MODE_INV                 = 4,	/**< INV 模式 */

ENCODING_TYPE = 1
MAXQP = 25
MINQP = 10
BIASLVL = 0
FROMQPSTEP = 3
GOPQPSTEP = 15
BITRATE = 8000
WIDTH = 1920
HEIGHT = 1080
; FPS: RATENUM / RATEDEN
; Encoder CPU does scale with this, roughly proportionally to frame count:
; measured on the test unit at 1920x1080, Encoder-0 was 3.38% at 3fps and 5.33% at
; 5fps. Still cheap -- the large win was fixing the framesource scaler, which
; took this thread from 24.18% to ~3.4%.
; Bytes scale with it too: ~4.06 GiB/day at 3fps, ~6.8 GiB/day at 5fps.
RATENUM = 5
RATEDEN = 1
; encoding profile 0: baseline; 1:MP; 2:HP
PROFILE = 0

[recording]
; Enable MKV recording (1=on, 0=off)
ENABLED = 1
; Output directory for MKV files
OUTPUT_DIR = /system/sdcard/DCIM/Recording
; Chunk duration in seconds
CHUNK_DURATION = 300
; Stop recording when disk usage exceeds this percentage
DISK_USAGE_THRESHOLD = 90

[grafana]
; Enable Grafana Cloud metrics push (true/false or 1/0)
GRAFANA_ENABLED = false
; InfluxDB line protocol push endpoint
GRAFANA_PUSH_URL = https://your-instance.grafana.net/api/v1/push/influx/write
; Grafana Cloud numeric user ID
GRAFANA_USERNAME = 123456
; Grafana Cloud API key with MetricsPublisher role
GRAFANA_API_KEY = your-grafana-api-key
; Push interval in milliseconds (default: 60000 = 1 minute)
GRAFANA_PUSH_INTERVAL_MS = 300000

[upload]
; Enable HTTPS file upload to server (1=on, 0=off)
ENABLED = 0
; Server upload endpoint URL
URL = https://your-server:3000/api/upload
; Shared authentication token
TOKEN = your-shared-secret-token
; Upload rate limit in KB/s (0 = unlimited)
; When ADAPTIVE_RATE=1, this acts as a hard upper cap
RATE_LIMIT_KBPS = 0
; Adaptive rate limiting (1=on, 0=off)
; Measures available bandwidth and throttles to ~80%, leaving headroom
; for other network traffic. Recommended when multiple cameras share WiFi.
ADAPTIVE_RATE = 1
; How often to scan for completed files (seconds)
SCAN_INTERVAL_S = 60
; Buffer entire file in memory before upload (1=yes, 0=stream from disk)
BUFFER_IN_MEMORY = 0

[audio]
; Record microphone audio into the MKV as a G.711A track (1=on, 0=off)
ENABLED = 0
; Audio input device id (0=digital mic, 1=analog mic; Dafang is usually 1)
DEV_ID = 1
; Sample rate in Hz (8000 is standard for G.711A; also 16000/24000/44100/48000)
SAMPLE_RATE = 8000

[http]
; Mini HTTP server for Home Assistant snapshots (1=on, 0=off)
ENABLED = 0
; HTTP port for snapshot requests
PORT = 8080

[smart]
; Smart encoding mode parameters (used when ENCODING_TYPE=3)
; maxQp: maximum quantization parameter (higher=more compression, lower quality)
; MAX_BITRATE is scaled against a 1920x1080 reference, so 1000 means 444 kbps
; at 1280x720. Values above ~1000 stop helping on a T20: the RC hits max QP,
; the bitrate clamp stops biting, and output overruns the cap anyway.
MAXQP = 45
; minQp: minimum quantization parameter
MINQP = 0
; staticTime: seconds of no scene change before dropping bitrate
STATIC_TIME = 2
; qualityLvl: quality level (higher=more compression, smaller files)
QUALITY_LVL = 3
; maxBitrate in kbps, scaled to resolution against a 1920x1080 reference.
; See docs/encoder-tuning.md for the measured byte/CPU curve. At 1920x1080
; this is a direct kbps figure, so 380 lands near 400 kbps actually encoded.
MAX_BITRATE = 380
; frmQPStep: per-frame QP adjustment step
FRM_QPSTEP = 3
; gopQPStep: per-GOP QP adjustment step
GOP_QPSTEP = 15
; changePos: scene change sensitivity (0-100, higher=less sensitive)
CHANGE_POS = 80

[night]
; Night mode encoding overrides (applied by the autonight thread)
; Set to 0 to keep day-mode settings at night
; FPS_NUM/FPS_DEN: reduce framerate at night (e.g., 2/1 = 2fps)
FPS_NUM = 0
FPS_DEN = 0
; BITRATE: lower bitrate at night (kbps, scaled to resolution)
BITRATE = 0
; MAXQP: more aggressive compression at night
MAXQP = 51
; QUALITY_LVL: accept lower quality at night
QUALITY_LVL = 5

[autonight]
; Built-in photosensitive night detection (replaces external client SIGUSR1)
; Enable to have t20-rtspd detect day/night and control IR LEDs + IR cut filter
ENABLED = 1
; NIGHT_THRESH: ISP exposure value above which we switch to night mode
NIGHT_THRESH = 1200000
; DAY_THRESH: ISP exposure value below which we switch back to day mode
DAY_THRESH = 930000
; IR_LED_THRESH: exposure value above which IR LEDs are turned on
IR_LED_THRESH = 3000000
; IR_LED_OFF: set to 1 to invert IR LED logic (for cameras facing IR-reflecting windows)
IR_LED_OFF = 0
; INTERVAL: seconds between light level checks
INTERVAL = 3

[darkskip]
; Discard recorded chunks that carry no usable image instead of uploading
; them. Covers the cases where the camera records a black picture forever:
; a dead IR illuminator (this unit's LED array does not illuminate), a lens
; cap, something pressed against the lens, or a camera aimed at nothing lit.
; Saves the upload and reclaims the card.
;
; The test is the ISP's exposure state, not the file size: the encoder runs
; CBR, so a black chunk still lands at the full bitrate cap and its size
; says nothing about brightness. A chunk is skipped only when essentially
; every exposure sample across its whole recording window was dark, so
; footage spanning dusk is still uploaded.
; Measured on this ISP: daylight peaks near ev 1.1M with analog gain in
; single digits; a genuinely unlit scene exceeds ev 30M with gain pinned at
; the 128 ceiling. Both conditions must hold.
ENABLED = 1
EV = 10000000
; Analog-gain ceiling on this ISP is 128. Normal day use is single digits.
AGAIN = 120
; Never discard a chunk shorter than this, even if dark. 0 disables the
; minimum. Keeps a short clip that may be the only footage of an event.
MIN_AGE = 120
; Percent of the chunk's exposure samples that must be dark. Not 100: the
; sample nearest a chunk boundary can catch the AE still converging after a
; night switch, and one bright sample in 64 was enough to veto the skip on a
; chunk that was black throughout. A chunk with a real stretch of light is
; still uploaded.
RATIO = 90

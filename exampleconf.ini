[user]

;	ENC_RC_MODE_FIXQP               = 0,	/**< Fixqp 模式 */
;	ENC_RC_MODE_CBR                 = 1,	/**< CBR 模式 */
;	ENC_RC_MODE_VBR                 = 2,	/**< VBR 模式*/
;	ENC_RC_MODE_SMART               = 3,	/**< Smart 模式*/
;	ENC_RC_MODE_INV                 = 4,	/**< INV 模式 */

ENCODING_TYPE = 1
MAXQP = 25
MINQP = 10
BIASLVL = 0
FROMQPSTEP = 3
GOPQPSTEP = 15
BITRATE = 8000
WIDTH = 1920
HEIGHT = 1080
; FPS: RATENUM / RATEDEN
RATENUM = 10
RATEDEN = 1
; encoding profile 0: baseline; 1:MP; 2:HP
PROFILE = 0

[recording]
; Enable MKV recording (1=on, 0=off)
ENABLED = 1
; Output directory for MKV files
OUTPUT_DIR = /system/sdcard/DCIM/Recording
; Chunk duration in seconds
CHUNK_DURATION = 300
; Stop recording when disk usage exceeds this percentage
DISK_USAGE_THRESHOLD = 90

[rtsp]
; Enable RTSP server (1=on, 0=off)
ENABLED = 0
; RTSP server port
PORT = 554

[grafana]
; Enable Grafana Cloud metrics push (true/false or 1/0)
GRAFANA_ENABLED = false
; InfluxDB line protocol push endpoint
GRAFANA_PUSH_URL = https://your-instance.grafana.net/api/v1/push/influx/write
; Grafana Cloud numeric user ID
GRAFANA_USERNAME = 123456
; Grafana Cloud API key with MetricsPublisher role
GRAFANA_API_KEY = your-grafana-api-key
; Push interval in milliseconds (default: 60000 = 1 minute)
GRAFANA_PUSH_INTERVAL_MS = 300000

[upload]
; Enable HTTPS file upload to server (1=on, 0=off)
ENABLED = 0
; Server upload endpoint URL
URL = https://your-server:3000/api/upload
; Shared authentication token
TOKEN = your-shared-secret-token
; Upload rate limit in KB/s (0 = unlimited)
; When ADAPTIVE_RATE=1, this acts as a hard upper cap
RATE_LIMIT_KBPS = 0
; Adaptive rate limiting (1=on, 0=off)
; Measures available bandwidth and throttles to ~80%, leaving headroom
; for other network traffic. Recommended when multiple cameras share WiFi.
ADAPTIVE_RATE = 1
; How often to scan for completed files (seconds)
SCAN_INTERVAL_S = 60
; Buffer entire file in memory before upload (1=yes, 0=stream from disk)
BUFFER_IN_MEMORY = 0

[audio]
; Record microphone audio into the MKV as a G.711A track (1=on, 0=off)
ENABLED = 0
; Audio input device id (0=digital mic, 1=analog mic; Dafang is usually 1)
DEV_ID = 1
; Sample rate in Hz (8000 is standard for G.711A; also 16000/24000/44100/48000)
SAMPLE_RATE = 8000